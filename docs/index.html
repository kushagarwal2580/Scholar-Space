<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholar Space</title>
    <!-- Use Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary-color: #22D3EE;
            --primary-hover: #06B6D4;
            --text-main: #FFFFFF;
            --text-secondary: #94A3B8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(34, 211, 238, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.05) 0%, transparent 50%);
        }

        .container {
            text-align: center;
            padding: 40px 32px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 380px;
            width: 85%;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 100px;
            height: 100px;
            background-color: rgba(34, 211, 238, 0.15);
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 24px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2);
        }

        .logo-container svg {
            width: 50px;
            height: 50px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            margin: 0 0 32px;
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 0;
            margin-bottom: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            gap: 10px;
        }

        .btn-download {
            background-color: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
        }

        .btn-download:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 211, 238, 0.4);
        }

        .btn-github {
            background-color: transparent;
            color: var(--text-main);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
        }

        .btn-github:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }
        
        .version-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: -4px;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Center Logo Frame -->
        <div class="logo-container">
            <!-- Layers / Book SVG Icon representing Scholar Space -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 12 12 17 22 12"></polyline>
                <polyline points="2 17 12 22 22 17"></polyline>
            </svg>
        </div>
        
        <h1>Scholar Space</h1>
        <p>Your comprehensive companion for organizing files, notes, and schedules effortlessly.</p>
        
        <!-- Download Button -->
        <a href="https://github.com/kushagarwal2580/Scholar-Space/releases/latest" id="download-btn" class="btn btn-download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download APK
        </a>
        <span class="version-text" id="version-text">Checking latest version...</span>
        
        <!-- GitHub Button -->
        <a href="https://github.com/kushagarwal2580/Scholar-Space" class="btn btn-github">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
            View on GitHub
        </a>
    </div>

    <script>
        // Automatically fetch the latest release asset link from GitHub via their API
        async function fetchLatestRelease() {
            try {
                const response = await fetch('https://api.github.com/repos/kushagarwal2580/Scholar-Space/releases/latest');
                if (!response.ok) throw new Error("Could not fetch release data");
                
                const data = await response.json();
                
                // Try to find the actual .apk file in the release assets
                const apkAsset = data.assets.find(asset => asset.name.toLowerCase().endsWith('.apk'));
                const downloadBtn = document.getElementById('download-btn');
                const versionText = document.getElementById('version-text');
                
                if (apkAsset) {
                    downloadBtn.href = apkAsset.browser_download_url; // Direct download link
                    downloadBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download Latest APK`;
                }
                
                // Give user feedback on which version it's downloading
                const version = data.tag_name ? data.tag_name.replace('v', '') : 'latest';
                versionText.textContent = \`Version \${version} available\`;
                
            } catch (e) {
                console.error('Error fetching latest release:', e);
                document.getElementById('version-text').textContent = 'Latest release available on GitHub';
            }
        }
        
        fetchLatestRelease();
    </script>
</body>
</html>
