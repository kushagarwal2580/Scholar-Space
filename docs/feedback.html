<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Scholar Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: rgba(255, 255, 255, 0.04);
            --primary-color: #22D3EE;
            --text-main: #FFFFFF;
            --text-secondary: #94A3B8;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 85% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 20%, rgba(217, 70, 239, 0.15) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.15) 0%, transparent 65%),
                radial-gradient(circle at 15% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 55%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 55%);
            background-attachment: fixed;
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 380px;
            width: 90%;
            margin: 20px auto;
            box-sizing: border-box;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 32px;
        }
        
        p.subtitle {
            color: var(--text-secondary);
            margin-top: 0;
            margin-bottom: 32px;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }

        input[type="email"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-main);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: #0F172A;
            border: none;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 12px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--text-main);
        }
        /* Google Forms does not natively support dark mode via embeds, so we use a CSS filter trick */
        .google-form-iframe {
            border-radius: 12px;
            background: transparent;
            width: 100%;
            height: 800px;
            border: 0;
            filter: invert(90%) hue-rotate(180deg) contrast(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Feedback & Support</h1>
        <p class="subtitle">Have a feature request, found a bug, or just want to say hi? Send us a message below.</p>

        <div style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
            <p style="font-size: 16px; margin-bottom: 24px; color: var(--text-secondary);">
                We'd love to hear from you! Please tap the button below to send us an email with your feedback, bug reports, or feature requests.
            </p>
            <button onclick="sendFeedbackEmail()" style="display: block; width: 100%; font-family: 'Space Grotesk', sans-serif; background-color: var(--primary-color); color: #0F172A; padding: 16px 24px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; margin-bottom: 16px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(34, 211, 238, 0.2);">
                Send Email
            </button>
        </div>
        
        <div style="text-align: center;">
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <script>
        function sendFeedbackEmail() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const to = "app.scholarspace@gmail.com";
            const subject = encodeURIComponent("Topic:");
            const bodyText = "Device Info (Model, Android Version):\n\n\nApp Version:\n\n\nDescription:\n\n\nUpload Attachments:\n(Please attach any screenshots or screen recordings to this email)";
            const body = encodeURIComponent(bodyText);
            
            if (isMobile) {
                window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
            } else {
                window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`, '_blank');
            }
        }
    </script>
</body>
</html>
